# Alert rules for ReadyBell. Metric meanings: docs/MONITORING.md.
groups:
  - name: readybell
    rules:
      - alert: ReadyBellDown
        expr: up{job="readybell"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "ReadyBell instance {{ $labels.instance }} is not scraped"

      - alert: HighServerErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="readybell",status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="readybell"}[5m])) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "More than 5% of requests fail with 5xx"

      - alert: PushFailureRatioHigh
        expr: |
          sum(rate(readybell_push_attempts_total{result=~"failed|expired"}[15m]))
            / sum(rate(readybell_push_attempts_total[15m])) > 0.2
          and sum(rate(readybell_push_attempts_total[15m])) > 0.01
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "More than 20% of Web Push attempts fail or hit expired endpoints"

      - alert: PushNotSendingAtAll
        expr: |
          sum(increase(readybell_orders_transitions_total{status="READY"}[15m])) > 0
          and sum(increase(readybell_push_attempts_total{result="sent"}[15m])) == 0
          and sum(increase(readybell_push_attempts_total[15m])) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Pushes are attempted but none is accepted (VAPID keys or push service?)"

      - alert: ReadyToPushLatencySlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(readybell_push_ready_latency_seconds_bucket[10m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 time from READY to push accepted is above the 2 s target"

      - alert: OutboxFailedEvents
        expr: max(outbox_failed) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Outbox events exhausted their retries and need attention (order-ready pushes may be lost)"

      - alert: OutboxBacklogGrowing
        expr: min_over_time(outbox_pending[15m]) > 0 and deriv(outbox_pending[15m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Outbox pending events never drain; the relay is stuck or too slow"

      # Optional: no SSE connection at all although orders keep being created.
      - alert: SseConnectionsDroppedToZero
        expr: |
          sum(readybell_sse_connections) == 0
          and sum(increase(readybell_orders_created_total[15m])) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "No SSE connections while orders are being created"
