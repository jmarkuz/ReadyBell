spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readybell}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only verifies it.
      # Never use create/create-drop/update outside dev/test.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # Databases that predate Flyway (created by ddl-auto) are adopted at V1 instead of failing
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: localhost
      port: 6379
      # Connection/command timeout for Redis operations.
      # Session and cache state are externalized to Redis so any replica can serve
      # any request (Req 12.5; ADR-006). Spring Session with Redis can be enabled
      # by adding spring-session-data-redis to the build and @EnableRedisHttpSession.
      timeout: 2000ms

readybell:
  cors:
    # Origins allowed to call the API from another host; empty when the UI is served by this app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  session:
    ttl: 24h
  sse:
    redis:
      # Relay order updates between replicas via Redis pub/sub; enable when running more than one node.
      enabled: ${SSE_REDIS_ENABLED:false}
  security:
    jwt:
      # HS256 signing key (>= 32 bytes). Required: the app refuses to start without it.
      secret: ${JWT_SECRET:}
      ttl: 1h
      refresh-grace: 7d
      login:
        # Share the failed-login counters between replicas through Redis
        redis: ${LOGIN_REDIS_ENABLED:false}
  vapid:
    enabled: true
    public-key: ${VAPID_PUBLIC_KEY:placeholder-public-key}
    private-key: ${VAPID_PRIVATE_KEY:placeholder-private-key}
    subject: mailto:admin@readybell.example.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
