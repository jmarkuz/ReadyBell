spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/readybell}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only verifies it.
      # Never use create/create-drop/update outside dev/test.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # The items of an order are inserted in one JDBC batch instead of one round trip each
          batch_size: 20
        order_inserts: true

  task:
    scheduling:
      # Boot's default is ONE thread, shared by the SSE heartbeat, the outbox relay poll, the outbox cleanup and
      # the session housekeeping; a slow push (retries sleep up to ~7.5 s) would stall all of them.
      pool:
        size: ${SCHEDULER_POOL_SIZE:4}

  flyway:
    enabled: true
    # Databases that predate Flyway (created by ddl-auto) are adopted at V1 instead of failing
    baseline-on-migrate: true
    baseline-version: 1

  data:
    redis:
      host: localhost
      port: 6379
      # Connection/command timeout for Redis operations.
      # Session and cache state are externalized to Redis so any replica can serve
      # any request (Req 12.5; ADR-006). Spring Session with Redis can be enabled
      # by adding spring-session-data-redis to the build and @EnableRedisHttpSession.
      timeout: 2000ms

readybell:
  cors:
    # Origins allowed to call the API from another host; empty when the UI is served by this app
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  session:
    ttl: 24h
  rate-limit:
    # Per-IP limits for the public endpoints; over the limit -> 429 with Retry-After
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Share the counters between replicas through Redis (falls back to per-node counters if Redis is down)
    redis: ${RATE_LIMIT_REDIS_ENABLED:false}
    # Reverse proxies (IP or CIDR) whose X-Forwarded-For is believed, e.g. RATE_LIMIT_TRUSTED_PROXIES=10.0.0.0/8
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
    rules:
      # POST /api/sessions creates a row and no customer flow uses it (the server starts the session with the order):
      # a per-address cap plus one global cap against a distributed flood
      - {name: session-start, method: POST, path: /api/sessions, limit: 30, window: 1m}
      - {name: session-start-all, method: POST, path: /api/sessions, key-by: global, limit: 300, window: 1m}
      # Customers of one restaurant share a Wi-Fi (one public address), so what a page may do is limited per session;
      # the per-address rule next to it is only a high ceiling against one machine hammering many sessions
      - {name: subscribe, method: POST, path: "/api/sessions/*/subscriptions", key-by: session, limit: 10, window: 1m}
      - {name: subscribe-ip, method: POST, path: "/api/sessions/*/subscriptions", limit: 60, window: 1m}
      - {name: track, method: GET, path: "/api/sessions/*/track", key-by: session, limit: 30, window: 1m}
      - {name: track-ip, method: GET, path: "/api/sessions/*/track", limit: 600, window: 1m}
      - {name: customer-poll, method: GET, path: "/api/sessions/*/orders/poll", key-by: session, limit: 60, window: 1m}
      - {name: customer-poll-ip, method: GET, path: "/api/sessions/*/orders/poll", limit: 1200, window: 1m}
      - {name: customer-stream, method: GET, path: "/api/sessions/*/orders/stream", key-by: session, limit: 10, window: 1m}
      - {name: customer-stream-ip, method: GET, path: "/api/sessions/*/orders/stream", limit: 120, window: 1m}
  sse:
    redis:
      # Relay order updates between replicas via Redis pub/sub; enable when running more than one node.
      enabled: ${SSE_REDIS_ENABLED:false}
  security:
    jwt:
      # HS256 signing key (>= 32 bytes). Required: the app refuses to start without it.
      secret: ${JWT_SECRET:}
      ttl: 1h
      refresh-grace: 24h   # an expired token can still be exchanged for a new one for this long
      login:
        # Share the failed-login counters between replicas through Redis
        redis: ${LOGIN_REDIS_ENABLED:false}
  vapid:
    enabled: true
    public-key: ${VAPID_PUBLIC_KEY:placeholder-public-key}
    private-key: ${VAPID_PRIVATE_KEY:placeholder-private-key}
    subject: mailto:admin@readybell.example.com

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
