# Local development only: activate with SPRING_PROFILES_ACTIVE=dev
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:3254/readybell}
    password: ${DB_PASSWORD:qwer1234}
  flyway:
    enabled: false       # dev lets Hibernate build the schema
  jpa:
    hibernate:
      ddl-auto: create   # recreates the schema on every start

readybell:
  cors:
    # The Vite dev server proxies /api and forwards its Origin header
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    users:
      - username: staff
        password: password
        roles: [STAFF]
        tenant-id: 00000000-0000-0000-0000-000000000001
      - username: admin
        password: admin
        roles: [RESTAURANT_ADMIN]
        tenant-id: 00000000-0000-0000-0000-000000000001
      - username: platform
        password: platform
        roles: [PLATFORM_ADMIN]
