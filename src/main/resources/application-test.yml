spring:
  datasource:
    url: jdbc:h2:mem:readybell-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false

  data:
    redis:
      # Use an embedded/mock Redis for testing if needed, or disable if Spring Session not required
      host: localhost
      port: 6379
      timeout: 2000ms

readybell:
  vapid:
    # VAPID is disabled in test profile; FakeNotificationSender is used instead (via IntegrationTestConfig)
    enabled: false

management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
