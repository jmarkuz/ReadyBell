spring:
  flyway:
    enabled: false   # tests build their H2 schema from the entities
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # Use an embedded H2 in PostgreSQL compatibility mode for slice tests that
  # exercise JPA schema generation without a real database.
  datasource:
    url: jdbc:h2:mem:readybell-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  data:
    redis:
      host: localhost
      port: 6379

readybell:
  outbox:
    # Test contexts are cached and share one in-memory database; a live relay in one of them would steal the
    # events of another test. Tests that need delivery call OutboxRelay.drain() themselves.
    enabled: false
  rate-limit:
    enabled: false       # existing tests share one client IP; RateLimitApiTest switches it on
  vapid:
    enabled: false
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-1234
    users:
      - username: admin
        password: admin
        roles: [RESTAURANT_ADMIN]
        tenant-id: 00000000-0000-0000-0000-0000000000a1
      - username: other
        password: other
        roles: [RESTAURANT_ADMIN]
        tenant-id: 00000000-0000-0000-0000-0000000000b2
      - username: platform
        password: platform
        roles: [PLATFORM_ADMIN]
  push:
    async: false          # deliver pushes inline so tests can assert on the result
    retry-delays-ms: ""   # no retries/sleeps in tests
