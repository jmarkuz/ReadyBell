spring:
  # Real PostgreSQL in a Testcontainers container (needs Docker). The tc: JDBC URL starts one container per JVM on
  # first use and every cached Spring context shares it (TC_DAEMON keeps it alive between connections).
  # Keep the image tag in line with docker-compose.yml.
  datasource:
    url: jdbc:tc:postgresql:16:///readybell?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  # The real migrations build the schema and Hibernate only checks the entities against it
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  # spring.data.redis.host/port are set by org.readybell.testsupport.RedisContainerInitializer (Testcontainers Redis)

readybell:
  outbox:
    # Test contexts are cached and share one in-memory database; a live relay in one of them would steal the
    # events of another test. Tests that need delivery call OutboxRelay.drain() themselves.
    enabled: false
  rate-limit:
    enabled: false       # existing tests share one client IP; RateLimitApiTest switches it on
  vapid:
    enabled: false
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-1234
    users:
      - username: admin
        password: admin
        roles: [RESTAURANT_ADMIN]
        tenant-id: 00000000-0000-0000-0000-0000000000a1
      - username: other
        password: other
        roles: [RESTAURANT_ADMIN]
        tenant-id: 00000000-0000-0000-0000-0000000000b2
      - username: platform
        password: platform
        roles: [PLATFORM_ADMIN]
  push:
    async: false          # deliver pushes inline so tests can assert on the result
    retry-delays-ms: ""   # no retries/sleeps in tests
