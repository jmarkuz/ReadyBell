name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check --no-daemon   # tests + coverage floor
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-reports, path: build/reports/tests }

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: dashboard-ui }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: dashboard-ui/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    # Real browser against the real stack: Spring Boot (dev profile) + Vite proxy + PostgreSQL
    # Pinned: ubuntu-latest is now 26.04, which Playwright 1.56 cannot install browsers for. Bump together with Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: readybell_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DB_URL: jdbc:postgresql://localhost:5432/readybell_e2e
      E2E_DB_USERNAME: postgres
      E2E_DB_PASSWORD: postgres
    defaults:
      run: { working-directory: dashboard-ui }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: dashboard-ui/package-lock.json }
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          # HTML report plus trace and video of every failed test
          path: |
            dashboard-ui/playwright-report
            dashboard-ui/test-results
          retention-days: 7

  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t readybell:ci .
