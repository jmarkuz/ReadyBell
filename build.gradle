plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'org.readybell'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Schema migrations
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // PostgreSQL driver (runtime)
    runtimeOnly 'org.postgresql:postgresql'

    // Web Push / VAPID (kept behind the NotificationSender port; ADR-005)
    implementation 'nl.martijndwars:web-push:5.1.1'
    // BouncyCastle is required by web-push for EC cryptography (VAPID key operations)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Embedded H2 for the test profile (application-test.yml uses H2 in PostgreSQL mode)
    testRuntimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.security:spring-security-test'

    // JUnit 5 (BOM already present via Spring Boot; keep explicit for clarity)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Architecture rules as tests (layering, no cycles between bounded contexts)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // Property-based testing (jqwik) on the JUnit 5 platform
    testImplementation 'net.jqwik:jqwik:1.9.2'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Guard against the suite quietly rotting: `./gradlew check` fails below these floors
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 0.75 }
            limit { counter = 'BRANCH'; minimum = 0.65 }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification
