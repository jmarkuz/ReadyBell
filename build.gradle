plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

// Spring Boot 3.4 manages Testcontainers 1.20.x, which talks to Docker with API 1.32 only; recent Docker engines
// (e.g. the GitHub ubuntu-latest runner) reject that ("client version 1.32 is too old"). 1.21.4 negotiates 1.44.
ext['testcontainers.version'] = '1.21.4'

// Spring Boot's BOM lags behind security fixes of its own dependencies (found by the Trivy image scan in CI).
// Newer releases of the same lines are forced here; drop an entry once the Boot BOM carries a version at least as new.
ext['jackson-bom.version'] = '2.21.8'
ext['netty.version'] = '4.1.140.Final'
ext['tomcat.version'] = '10.1.62'
ext['postgresql.version'] = '42.7.14'

group = 'org.readybell'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Schema migrations
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // PostgreSQL driver (runtime)
    runtimeOnly 'org.postgresql:postgresql'

    // Web Push / VAPID (kept behind the NotificationSender port; ADR-005)
    implementation('nl.martijndwars:web-push:5.1.1') {
        // Declared by web-push 5.1.1 but not referenced by any of its classes (checked in the jar); it carries known
        // CVEs whose fixes exist only in the incompatible 3.x line, so it is left out instead of upgraded
        exclude group: 'org.asynchttpclient', module: 'async-http-client'
    }
    // web-push 5.1.1 also pulls an old jose4j (0.7.0, found by the Trivy scan in CI): a fixed release is forced
    constraints {
        implementation('org.bitbucket.b_c:jose4j:0.9.6') { because 'web-push 5.1.1 brings 0.7.0 (CVE fixes in 0.9.x)' }
    }
    // BouncyCastle is required by web-push for EC cryptography (VAPID key operations)
    implementation 'org.bouncycastle:bcprov-jdk18on:1.87'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Real PostgreSQL for integration tests (application-test.yml uses a Testcontainers JDBC URL); needs Docker
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.security:spring-security-test'

    // JUnit 5 (BOM already present via Spring Boot; keep explicit for clarity)
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Architecture rules as tests (layering, no cycles between bounded contexts)
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // Property-based testing (jqwik) on the JUnit 5 platform
    testImplementation 'net.jqwik:jqwik:1.9.2'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Guard against the suite quietly rotting: `./gradlew check` fails below these floors
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 0.85 }
            limit { counter = 'BRANCH'; minimum = 0.75 }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification
